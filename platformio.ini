; ESP32 load-cell transmitter with local SSD1306 OLED and a Bluetooth (BLE)
; link to the handheld DUAL SCALE display. One source builds both units; the
; LOAD_CELL_UNIT build flag selects which (A or B).

[platformio]
default_envs = load_cell_a

; ----------------------------------------------------------------------------
; Load Cell A  (LOAD_CELL_UNIT=1, advertises as "LOAD_CELL_1")
; ----------------------------------------------------------------------------
[env:load_cell_a]
; Pin to the Arduino-ESP32 2.0.x toolchain (platform 6.5.0). The newest
; espressif32 (8.0.0) ships an IDF that breaks NimBLE-Arduino 2.3.2 (missing
; syscfg.h / nimconfig.h at build time). 6.5.0 matches the handheld display's
; pin and builds cleanly with the same NimBLE version.
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
build_flags =
    -D LOAD_CELL_UNIT=1
lib_deps =
    h2zero/NimBLE-Arduino@2.3.2
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library@^1.0.6
    adafruit/Adafruit SSD1306
monitor_speed = 115200

; ----------------------------------------------------------------------------
; Load Cell B  (LOAD_CELL_UNIT=2, advertises as "LOAD_CELL_2")
; Upload this environment to the second load-cell ESP32.
; ----------------------------------------------------------------------------
[env:load_cell_b]
extends = env:load_cell_a
build_flags =
    -D LOAD_CELL_UNIT=2
